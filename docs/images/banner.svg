      <rect x="42" y="15" width="6" height="6" rx="2" fill="#d5e1d9"/>
      <rect x="14" y="51" width="56" height="232" rx="13" fill="#f6f8f6" stroke="#e3e9e4"/>
      <rect x="31" y="67" width="22" height="4" rx="2" fill="#acbeb4"/>
      <rect x="31" y="77" width="15" height="4" rx="2" fill="#c5d2ca"/>
