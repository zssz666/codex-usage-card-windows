    <text x="60" y="188" font-size="24" fill="#50736a">Your remaining allowance. In your sidebar.</text>
    <text x="60" y="240" font-size="18" fill="#50736a">5-hour + weekly rings · Reset details · Original UI</text>
    <rect x="59" y="273" width="218" height="42" rx="8" fill="#ffffff" stroke="#c6d9cf"/>
    <path d="M78 286v15l12-7.5z" fill="#2e846f"/>
    <text x="103" y="299" font-size="16" font-weight="600" fill="#285d50">Start.cmd → Codex</text>
    <text x="60" y="382" font-size="12" letter-spacing="1.7" fill="#6b887d">COMMUNITY WINDOWS PORT  /  OPEN SOURCE  /  MIT</text>
    <g transform="translate(824 52)">
      <rect x="8" y="9" width="296" height="300" rx="20" fill="#cbded3" opacity=".6"/>
