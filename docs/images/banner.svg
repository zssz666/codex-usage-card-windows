<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Codex Usage Card for Windows</title>
  <desc id="description">Remaining usage at a glance. An illustrative sidebar with two compact rings accompanies the project title.</desc>
  <defs>
    <linearGradient id="ring" x1="0" x2="1" y1="1" y2="0">
      <stop stop-color="#299ac0"/>
      <stop offset="1" stop-color="#58bba6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#eff4f2"/>
  <path d="M0 342H1200M0 378H1200" stroke="#dfe8e3"/>
  <circle cx="1080" cy="40" r="200" fill="#e1ece5"/>
  <circle cx="1080" cy="40" r="155" fill="none" stroke="#d1e3da" stroke-width="2"/>
  <circle cx="1080" cy="40" r="115" fill="none" stroke="#d1e3da" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif">
