<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">运行原理 / How it works</title>
  <desc id="description">Start.cmd launches Codex through its registered Windows alias. A Node agent reads CLI app-server usage over stdio and updates sidebar rings through a loopback CDP connection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5c8574"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#f4f7f4"/>
  <g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">
    <text x="40" y="44" font-size="20" font-weight="700" fill="#204c3c">本机数据流 / Local data flow</text>
    <text x="40" y="70" font-size="13" fill="#638474">Portable files · Original ring UI · No application-package changes</text>
    <g stroke="#c8dace" fill="#ffffff">
      <rect x="40" y="105" width="210" height="86" rx="12"/>
      <rect x="340" y="105" width="250" height="86" rx="12"/>
      <rect x="680" y="105" width="480" height="86" rx="12"/>
      <rect x="40" y="270" width="280" height="90" rx="12"/>
      <rect x="450" y="270" width="280" height="90" rx="12"/>
      <rect x="860" y="270" width="300" height="90" rx="12"/>
    </g>
    <g fill="#204c3c" text-anchor="middle">
      <text x="145" y="140" font-size="18" font-weight="700">Start.cmd</text>
      <text x="145" y="165" font-size="13">手动启动 / Manual start</text>
      <text x="465" y="140" font-size="17" font-weight="700">Registered app alias</text>
      <text x="465" y="165" font-size="13">应用执行别名</text>
      <text x="920" y="140" font-size="18" font-weight="700">Codex desktop + local debug endpoint</text>
      <text x="920" y="165" font-size="13">桌面客户端 / 127.0.0.1:39222</text>
      <text x="180" y="305" font-size="18" font-weight="700">Codex CLI app-server</text>
      <text x="180" y="331" font-size="13">真实额度 / Real usage data</text>
      <text x="590" y="305" font-size="18" font-weight="700">Node.js agent</text>
      <text x="590" y="331" font-size="13">读取与更新 / Read &amp; update</text>
      <text x="1010" y="305" font-size="18" font-weight="700">Sidebar rings</text>
      <text x="1010" y="331" font-size="13">侧栏圆环 / Original UI</text>
    </g>
    <g fill="none" stroke="#5c8574" stroke-width="2" marker-end="url(#arrow)">
      <path d="M250 148H330"/>
      <path d="M590 148H670"/>
      <path d="M320 315H440"/>
      <path d="M730 315H850"/>
      <path d="M1010 191V260" stroke-dasharray="5 5"/>
    </g>
    <text x="385" y="300" font-size="12" fill="#638474" text-anchor="middle">stdio / JSON-RPC</text>
    <text x="795" y="300" font-size="12" fill="#638474" text-anchor="middle">local CDP</text>
    <text x="40" y="397" font-size="12" fill="#638474">Reset-credit supplement may use existing local authentication; see SECURITY.md / 重置卡补充查询及认证说明见 SECURITY.md</text>
  </g>
</svg>
